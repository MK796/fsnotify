name: 'staticcheck'
on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staticcheck:
    name:    'staticcheck'
    runs-on: 'ubuntu-latest'
    env:
      GO_VERSION:          '1.26'
      STATICCHECK_VERSION: '2026.1'
    steps:
      # Setup
      - uses: 'actions/checkout@v6'
      - uses: 'actions/setup-go@v6'
        with:
          go-version:            '${{ env.GO_VERSION }}'
          cache:                 true
          cache-dependency-path: 'go.sum'
      - uses: 'actions/cache@v5'
        with:
          path: '${{ runner.temp }}/staticcheck'
          key: "staticcheck-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ env.STATICCHECK_VERSION }}-${{ hashFiles('go.sum') }}-${{ github.sha }}"
          restore-keys: |
            staticcheck-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ env.STATICCHECK_VERSION }}-${{ hashFiles('go.sum') }}-

      # Run
      - run: |
          export STATICCHECK_CACHE="${{ runner.temp }}/staticcheck"
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          staticcheck -version

          fail=0
          for a in $(go tool dist list); do
            export GOOS=${a%%/*}
            export GOARCH=${a#*/}

            case "$GOOS" in
              (android|ios)  continue ;; # Requires cgo to link.
              (js|wasip1)    continue ;; # No build tags in internal/ TODO: should maybe fix?
              (plan9)        continue ;; # Errors out on some missing definitions like syscall.Errno.
            esac

            echo $a
            go vet ./... || fail=1
            staticcheck ./... || fail=1
          done
          exit $fail
