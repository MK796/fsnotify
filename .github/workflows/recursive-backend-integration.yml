name: recursive backend integration

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        go:
          - '1.23'
          - '1.26'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Symlink and ownership contracts
        env:
          GOTRACEBACK: all
        run: >
          go test -race -v -count=50 -shuffle=on -timeout=10m
          -run '^(TestFilterInotifyEvent|TestInotifyEventPath|TestInotifyPrepareReadDoesNotExpirePendingMoves|TestInotifySymlinkAliasOwnership|TestRemove|TestWatchList)$' .
      - name: Recursive ownership and move contracts
        env:
          GOTRACEBACK: all
        run: >
          go test -race -v -count=50 -shuffle=on -timeout=10m
          -run '^(TestInotifyRecursiveMoveOutDropsInternalWatches|TestInotifyRecursiveMoveOutReplacementIsWatched|TestInotifyRecursiveRenameTransfersOwnership|TestInotifyRecursiveRootRenameRemovesExplicitWatch|TestInotifyRecursiveAncestorRenameRemovesExplicitDescendantWatch|TestInotifyRecursiveAddRollback|TestInotifyRecursiveSubtreeRegistrationRollback|TestInotifyRecursiveAddExistingPathIsNoop)$' .
      - name: Recursive move exhaustion
        env:
          GOTRACEBACK: all
        run: >
          go test -race -v -count=10 -shuffle=on -timeout=10m
          -run '^TestInotifyRecursiveMoveOutReplacementExhaustion$' .
      - name: Recursive lifecycle scripts
        env:
          GOTRACEBACK: all
        run: go test -race -v -count=20 -shuffle=on -timeout=10m -run '^TestScript$/watch-recurse' .
      - name: Remove and close races
        env:
          GOTRACEBACK: all
        run: >
          go test -race -v -count=50 -shuffle=on -timeout=10m
          -run '^(TestInotifyRemoveInvalidatedWatch|TestRemoveState|TestRace|TestClose)$' .
      - name: Full deterministic race-enabled repository suite
        env:
          GOTRACEBACK: all
        run: go test -race -parallel=1 -timeout=10m ./...
      - name: Full deterministic race-enabled repository suite with explicit buffer
        env:
          FSNOTIFY_BUFFER: '4096'
          GOTRACEBACK: all
        run: go test -race -parallel=1 -timeout=10m ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        go:
          - '1.23'
          - '1.26'
        buffer:
          - '0'
          - '4096'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test integrated Windows backend
        env:
          FSNOTIFY_BUFFER: ${{ matrix.buffer }}
          GOTRACEBACK: all
        run: |
          go test -race -parallel=1 -timeout=10m ./...
          go test -race -v -parallel=1 -count=20 -shuffle=on -timeout=10m -run '^TestWindowsIOLifecycle$' .
          go test -race -v -parallel=1 -count=20 -shuffle=on -timeout=10m -run '^TestScript$/watch-recurse' .
          go test -race -v -count=10 -shuffle=on -timeout=90s -run '^TestRace$/(add_and_remove_watches|remove_self)$' .
          go test -race -v -count=10 -shuffle=on -timeout=6m -run '^TestClose$/(close_while_removing_files|double_close)$' .

  macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - macos-15-intel
          - macos-latest
        go:
          - '1.23'
          - '1.26'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test integrated kqueue backend
        env:
          GOTRACEBACK: all
        run: |
          go test -race -timeout=10m ./...
          FSNOTIFY_BUFFER=4096 go test -race -timeout=10m ./...
          go test -race -v -count=20 -shuffle=on -timeout=10m -run '^TestScript$/watch-recurse' .

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test integrated kqueue backend on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg update -f && pkg install -y go
          run: |
            pw useradd action -m
            chown -R action:action .
            su action -c 'go version'
            su action -c 'go test -race -timeout=10m ./...'
            FSNOTIFY_BUFFER=4096 su action -c 'go test -race -timeout=10m ./...'
            su action -c 'go test -race -v -count=10 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse" .'

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test integrated kqueue backend on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: pkg_add go
          run: |
            useradd -mG wheel action
            su action -c 'go version'
            su action -c 'go test -timeout=10m ./...'
            FSNOTIFY_BUFFER=4096 su action -c 'go test -timeout=10m ./...'
            su action -c 'go test -v -count=10 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse" .'

  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test integrated kqueue backend on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: pkg_add go
          run: |
            useradd -mG wheel action
            su action -c '/usr/pkg/bin/go??? version'
            su action -c '/usr/pkg/bin/go??? test -timeout=10m ./...'
            FSNOTIFY_BUFFER=4096 su action -c '/usr/pkg/bin/go??? test -timeout=10m ./...'
            su action -c '/usr/pkg/bin/go??? test -v -count=10 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse" .'

  dragonflybsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test integrated kqueue backend on DragonFly BSD
        uses: vmactions/dragonflybsd-vm@v1
        with:
          prepare: pkg install -y go
          run: |
            pw user add -mG wheel -n action
            su action -c 'go version'
            su action -c 'go test -timeout=10m ./...'
            env FSNOTIFY_BUFFER=4096 su action -c 'go test -timeout=10m ./...'
            su action -c 'go test -v -count=10 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse" .'

  illumos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test integrated FEN backend on OmniOS
        uses: vmactions/omnios-vm@v1
        with:
          prepare: pkg install go-126
          run: |
            useradd action
            export GOCACHE=/tmp/go-cache
            export GOPATH=/tmp/go-path
            su action -c '/opt/ooce/go-1.26/bin/go version'
            su action -c '/opt/ooce/go-1.26/bin/go test -timeout=10m ./...'
            FSNOTIFY_BUFFER=4096 su action -c '/opt/ooce/go-1.26/bin/go test -timeout=10m ./...'
            su action -c '/opt/ooce/go-1.26/bin/go test -v -count=20 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse/remove-watched-dir$" .'
            su action -c '/opt/ooce/go-1.26/bin/go test -v -count=100 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse/mkdir-p-nested$" .'
            su action -c '/opt/ooce/go-1.26/bin/go test -v -count=10 -shuffle=on -timeout=10m -run "^TestScript$/watch-recurse" .'
