name: windows recursive diagnostic

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - '.github/workflows/windows-recursive-diagnostic.yml'

jobs:
  remove-self:
    runs-on: windows-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        go:
          - '1.23'
          - '1.26'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Diagnose recursive remove-self lifecycle
        env:
          GOTRACEBACK: all
        run: >-
          go test
          -race
          -v
          -count=1
          -timeout=90s
          -run '^TestRace$/^remove_self$'
          .
